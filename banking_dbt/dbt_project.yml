name: banking_dbt
version: '1.0.0'
config-version: 2
profile: banking_dbt
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  banking_dbt:
    # Materialize staging models as views, and marts as tables
    staging:
      +schema: SILVER
      +materialized: view
    silver:
      +schema: SILVER
      +materialized: table
    gold:
      +schema: GOLD
      +materialized: table
