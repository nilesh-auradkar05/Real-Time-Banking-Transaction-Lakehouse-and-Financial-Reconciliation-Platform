version: 2
models:
  - name: fin_district
    columns:
      - name: district_id
        data_tests: [not_null, unique]
  - name: fin_client
    columns:
      - name: client_id
        data_tests: [not_null, unique]
  - name: fin_account
    columns:
      - name: account_id
        data_tests: [not_null, unique]
  - name: fin_disp
    columns:
      - name: disp_id
        data_tests: [not_null, unique]
  - name: fin_card
    columns:
      - name: card_id
        data_tests: [not_null, unique]
  - name: fin_loan
    columns:
      - name: loan_id
        data_tests: [not_null, unique]
  - name: fin_order
    columns:
      - name: order_id
        data_tests: [not_null, unique]
  - name: fin_trans
    columns:
      - name: trans_id
        data_tests: [not_null, unique]
      - name: data_origin
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [czech_original, faker_synthetic]