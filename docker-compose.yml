# Shared by every Airflow service (pattern from the Food Delivery platform's airflow/docker-compose.yaml).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: dockerfile-airflow.dockerfile
  image: banking-airflow:3.3.2
  profiles: ["airflow"]
  restart: always
  env_file:
    # SNOWFLAKE_* credentials, shared by the snowflake_banking connection, dbt and reconcile.py.
    - path: ./snowflake/.env
      required: false            # airflow-init fails with a clear message when it is missing
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    # Airflow 3 components sign Execution API calls with this shared secret.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-only-change-me}
    # Tasks reach the Execution API by the api-server's service name; localhost would point
    # at the scheduler's own container and every task would fail with a state mismatch.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    SNOWFLAKE_SQL_HOME: /opt/airflow/snowflake
    BANKING_SCRIPTS_HOME: /opt/airflow/scripts
    DBT_PROJECT_DIR: /opt/airflow/banking_dbt
    DBT_TARGET: prod
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  volumes:
    - ./docker/dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs      # named volume: bind mounts on NTFS/WSL are not writable by uid 50000
    - ./snowflake:/opt/airflow/snowflake:ro
    - ./scripts:/opt/airflow/scripts:ro
    - ./banking_dbt:/opt/airflow/banking_dbt:ro
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # internal Docker network
      - "29092:29092" # host machine access
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Set KAFKA_CLUSTER_ID in .env}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  connect:
    image: debezium/connect:2.2
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: 'kafka:9092'
      GROUP_ID: '1'
      CONFIG_STORAGE_TOPIC: 'connect-configs'
      OFFSET_STORAGE_TOPIC: 'connect-offsets'
      STATUS_STORAGE_TOPIC: 'connect-status'
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      KEY_CONVERTER: 'org.apache.kafka.connect.json.JsonConverter'
      VALUE_CONVERTER: 'org.apache.kafka.connect.json.JsonConverter'

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    command: >
      postgres -c wal_level=logical
              -c max_wal_senders=10
              -c max_replication_slots=10
    
  # ---- Airflow 3 (LocalExecutor) ---------------------------------------------------------
  # Opt-in: `docker compose --profile airflow up -d`. UI http://localhost:8080
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    profiles: ["airflow"]
    restart: always
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # separate from the banking source database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        missing=""
        for v in SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_PASSWORD; do
          [ -n "$${!v:-}" ] || missing="$$missing $$v"
        done
        if [ -n "$$missing" ]; then
          echo "snowflake/.env is missing:$$missing (copy snowflake/.env.example)" >&2; exit 1
        fi
        airflow db migrate
        if airflow users list 2>/dev/null | awk '{print $$3}' | grep -qx "$${AIRFLOW_ADMIN_USER}"; then
          echo "Airflow user $${AIRFLOW_ADMIN_USER} already exists"
        else
          airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Airflow --lastname Admin --role Admin --email admin@example.com
        fi
        airflow connections get snowflake_banking -o json > /dev/null
        echo "airflow-init complete"
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server            # Airflow 3: replaces `webserver`, also serves the Execution API
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler             # runs tasks (LocalExecutor) that report to the Execution API
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor         # Airflow 3: DAG parsing is its own component
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  kafka-s3-sink:
    depends_on:
      - kafka
    build:
      context: ./consumer
      dockerfile: Dockerfile
    env_file:
      - ./consumer/.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    stop_grace_period: 90s

volumes:
  kafka_data:
    name: banking_kafka_data
  airflow_postgres_data:
  airflow_logs:
  postgres_data:
networks:
  default:
    name: banking-mds-net
